name: "npm"
on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]
    workflow_dispatch:
jobs:
    npm:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
            attestations: write
        env:
            # Optional: only the legacy real-device suite needs it. Forks do not
            # carry this secret and the hermetic fixture suite still runs.
            SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        steps:
            - uses: actions/checkout@v6
            - name: Setup SOPS
              if: env.SOPS_AGE_KEY != ''
              uses: nhedger/setup-sops@v2
              with:
                  version: "latest"
            - name: Decrypt database file
              if: env.SOPS_AGE_KEY != ''
              run: |
                  sops --decrypt KoboReader.sqlite.enc > KoboReader.sqlite
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - name: Install dependencies
              run: npm install
            - name: Run lint
              run: npm run lint
            - name: Check formatting
              run: npm run format:check
            - name: Run tests
              run: npm run test
            - name: Run build
              run: npm run build
            - name: Upload build artifact
              uses: actions/upload-artifact@v6
              with:
                  name: main-js-build
                  path: main.js
                  retention-days: 7

            - name: Generate artifact attestation
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: actions/attest-build-provenance@v3
              with:
                  subject-path: main.js
