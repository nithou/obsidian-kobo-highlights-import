name: Publish plugin
on:
    release:
        types: [published]
env:
    PLUGIN_ID: obsidian-kobo-highlights-importer-plugin
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - name: Build
              run: |
                  npm install
                  npm run build
                  mkdir "${{ env.PLUGIN_ID }}"
                  cp main.js manifest.json styles.css "${{ env.PLUGIN_ID }}"
                  zip -r "${{ env.PLUGIN_ID }}.zip" "${{ env.PLUGIN_ID }}"
                  ls
            - name: Upload release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  gh release upload "$TAG" main.js manifest.json styles.css \
                    "${{ env.PLUGIN_ID }}.zip" --clobber
